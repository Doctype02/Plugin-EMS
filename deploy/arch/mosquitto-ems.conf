# /etc/mosquitto/conf.d/ems.conf  (incluido desde /etc/mosquitto/mosquitto.conf con: include_dir /etc/mosquitto/conf.d)
# Broker del EMS. Anónimo sólo para la red local de la demo: para exponerlo fuera, usar password_file.
listener 1883 127.0.0.1
allow_anonymous true
persistence true
persistence_location /var/lib/mosquitto/
