# <provisioning>/datasources/ems-influx.yaml
apiVersion: 1
datasources:
  - name: EMS InfluxDB
    uid: ems-influx
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8086
    isDefault: false
    jsonData:
      version: Flux
      organization: utp
      defaultBucket: ems
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUX_TOKEN_GRAFANA
