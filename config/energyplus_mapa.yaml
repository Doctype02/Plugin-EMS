# Mapa zonas EMS ⇄ zonas térmicas del IDF del modelo de 5 plantas (data/energyplus/modelo/in.idf).
# Uso: python -m ems energyplus --idf data/energyplus/modelo/in.idf \
#        --epw data/clima/PAN_PO_Panama-Albrook.Gelabert.Intl.AP.783842_TMYx.2011-2025.epw
# Las luces y equipos del modelo se definen por tipo de espacio (no por zona): sin actuadores "luces"/"equipos"
# el puente sólo actúa sobre el setpoint de enfriamiento. var_enfriamiento: carga del terminal VRF/PTAC.
anio: 2006
zonas:
