# Edificio de oficinas de 3 niveles en Ciudad de Panamá — 10 zonas
# Todos los valores son supuestos de diseño documentados; modifíquelos para escenarios/sensibilidad.

edificio:
  nombre: edificio1
  zona_horaria: America/Panama
  paso_min: 5                # paso de simulación
  v_ll: 480                  # tensión línea-línea (V), servicio 277/480 V trifásico
  shr: 0.78                  # razón de calor sensible del equipo DX (resto = latente, clima húmedo)
  fraccion_standby_equipos: 0.45  # potencia de equipos no usados pero energizados
  fan_frac: 0.08             # potencia del ventilador / capacidad térmica (kW/kW)
  ventilacion_m3s_persona: 0.010   # 10 L/s/persona (ASHRAE 62.1 oficinas, aprox.)

clima:
  fuente: sintetico          # sintetico | epw
  epw: null                  # ruta a un EPW (p. ej. PAN_Tocumen) si fuente = epw
  t_min_c: 24.5
  t_max_c: 31.5
  hora_t_max: 14.5
  irr_max_wm2: 850
  nubosidad_media: 0.35      # 0 despejado … 1 cubierto
  semilla: 7

ocupacion:
  hora_entrada: 7.5
  hora_salida: 17.5
  almuerzo: [12.0, 13.0]
  fraccion_almuerzo: 0.55
  fraccion_sabado: 0.15
  ruido: 0.10
  semilla: 11

# Precios y factores para Panamá (supuestos; actualice con pliego tarifario ASEP vigente)
tarifa:
  precio_punta_usd_kwh: 0.245      # lunes-viernes 09:00-17:00
  precio_fuera_punta_usd_kwh: 0.185
  hora_punta: [9, 17]
  cargo_demanda_usd_kw_mes: 19.50
  factor_co2_kg_kwh: 0.31

# Inversión del EMS (para ROI)
economia:
  capex_usd:                        # retrofit típico ≈ 35–40 USD/m2 (supuesto, cotizar localmente)
    sensores_ocupacion_temp_lux: 4500   # 10 zonas: PIR/ultrasonido, T/HR, lux
    controladores_hvac: 14400           # 8 zonas × 1 800 USD (controlador + relés + sondas)
    control_iluminacion: 24000          # drivers dimerizables + controladores ≈ 12 USD/m2
    enchufes_inteligentes_pdu: 6000
    medicion_electrica: 4500            # medidor de red + submedición por tablero
    gateway_servidor_red: 5000
    software_integracion: 12000
    puesta_en_marcha_capacitacion: 6000
  opex_usd_anio: 3500              # mantenimiento, licencias, calibración
  vida_util_anios: 10
  tasa_descuento: 0.08
  escalamiento_tarifa_anual: 0.02
  dias_laborables_anio: 250
  dias_no_laborables_anio: 115

ems:
  banda_histeresis_c: 0.5          # ±banda alrededor del setpoint
  setpoint_ocupado_c: 24.0
  setpoint_desocupado_c: 27.0
  setpoint_baseline_c: 22.5
  precool_min: 60                  # antes de la entrada
  lux_objetivo: 500
  equipos_desocupado_ems: 0.10     # fracción de circuitos de enchufes energizados sin ocupación (EMS)
  retardo_vacancia_min: 15
  luces_desocupado_ems: 0.0
  limite_demanda_kw: 145           # respuesta a la demanda (peak shaving), ~90 % del pico con reglas
  dr_histeresis_kw: 10
  dr_margen_confort_c: 0.75        # zonas a < margen del confort_max no se deslastran
  dr_setpoint_extra_c: 1.5
  dr_luces_nivel: 0.70
  dr_equipos_nivel: 0.85
  confort_max_c: 26.0              # límite superior de confort en ocupación
  confort_min_c: 21.0
  alarma_servidor_c: 27.0
  mpc_horizonte_pasos: 6
  mpc_niveles: [0.0, 0.25, 0.5, 0.75, 1.0]
  mpc_peso_confort: 25.0           # USD por K·h fuera de banda
  mpc_peso_pico: 0.02              # USD por kW sobre el límite por paso

baseline:
  hvac_horario: [6.0, 20.0]
  luces_horario: [6.5, 19.5]
  luces_nivel: 1.0

cargas_fijas:   # cargas del edificio que no pertenecen a una zona
  - {nombre: Ascensores, kw_ocupado: 6.0, kw_desocupado: 1.0, critica: true, fp: 0.80}
  - {nombre: Bombas agua, kw_ocupado: 3.0, kw_desocupado: 1.5, critica: true, fp: 0.85}
  - {nombre: Iluminacion exterior, kw_noche: 3.5, critica: false, fp: 0.95}

# Zonas: area m2, ocupantes, densidades de carga, envolvente (UA kW/K), capacitancia (kWh/K),
# ventanas (m2, SHGC), HVAC (capacidad térmica kW, COP)
zonas:
  - {id: Z01, nombre: Lobby, tipo: lobby, critica: false, area: 220, ocupantes: 15, lpd: 9, epd: 3,
     ua: 0.85, c: 9.0, ventana: 45, shgc: 0.35, hvac_kw: 24, cop: 3.0, lux_dia_max: 650}
  - {id: Z02, nombre: Oficinas P1 Norte, tipo: oficina, critica: false, area: 300, ocupantes: 30, lpd: 10, epd: 12,
     ua: 0.95, c: 12.5, ventana: 28, shgc: 0.35, hvac_kw: 30, cop: 3.0, lux_dia_max: 380}
  - {id: Z03, nombre: Oficinas P1 Sur, tipo: oficina, critica: false, area: 300, ocupantes: 30, lpd: 10, epd: 12,
     ua: 0.95, c: 12.5, ventana: 34, shgc: 0.35, hvac_kw: 30, cop: 3.0, lux_dia_max: 450}
  - {id: Z04, nombre: Oficinas P2 Norte, tipo: oficina, critica: false, area: 300, ocupantes: 28, lpd: 10, epd: 12,
     ua: 1.00, c: 12.0, ventana: 28, shgc: 0.35, hvac_kw: 30, cop: 3.0, lux_dia_max: 380}
  - {id: Z05, nombre: Oficinas P2 Sur, tipo: oficina, critica: false, area: 300, ocupantes: 28, lpd: 10, epd: 12,
     ua: 1.00, c: 12.0, ventana: 34, shgc: 0.35, hvac_kw: 30, cop: 3.0, lux_dia_max: 450}
  - {id: Z06, nombre: Sala de conferencias, tipo: conferencia, critica: false, area: 120, ocupantes: 40, lpd: 11, epd: 6,
     ua: 0.45, c: 5.0, ventana: 12, shgc: 0.35, hvac_kw: 18, cop: 3.0, lux_dia_max: 300}
  - {id: Z07, nombre: Laboratorio, tipo: laboratorio, critica: false, area: 180, ocupantes: 16, lpd: 12, epd: 25,
     ua: 0.65, c: 8.0, ventana: 15, shgc: 0.35, hvac_kw: 26, cop: 3.0, lux_dia_max: 300, min_equipos: 0.25}
  - {id: Z08, nombre: Cafeteria, tipo: cafeteria, critica: false, area: 160, ocupantes: 45, lpd: 9, epd: 30,
     ua: 0.60, c: 6.5, ventana: 20, shgc: 0.35, hvac_kw: 24, cop: 3.0, lux_dia_max: 500, min_equipos: 0.35}
  - {id: Z09, nombre: Cuarto de servidores, tipo: servidores, critica: true, area: 60, ocupantes: 1, lpd: 8, epd: 0,
     it_kw: 18.0, ua: 0.20, c: 3.0, ventana: 0, shgc: 0.0, hvac_kw: 30, cop: 2.8, setpoint_fijo: 22.0, lux_dia_max: 0}
  - {id: Z10, nombre: Seguridad UPS emergencia, tipo: soporte, critica: true, area: 80, ocupantes: 2, lpd: 6, epd: 35,
     ua: 0.30, c: 3.5, ventana: 4, shgc: 0.35, hvac_kw: 10, cop: 3.0, setpoint_fijo: 24.0, lux_dia_max: 150}
