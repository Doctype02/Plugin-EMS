# Edificio de oficinas de 2 plantas en Ciudad de Panamá — 10 zonas, 800 m²
# Parámetros tomados del modelo OpenStudio/EnergyPlus "EMS_Edificio_Ultima simulacion"
# (in.idf, eplusout.sql, floorplan.json). Origen de cada valor indicado en los comentarios.
# Los datos horarios de esa simulación están en data/energyplus/ (tools/importar_energyplus.py).

edificio:
  nombre: edificio1
  zona_horaria: America/Panama
  latitud: 8.97                # EPW Panamá-Albrook
  longitud: -79.5
  paso_min: 5
  altura_piso_m: 3.0           # floorplan.json: floor_to_ceiling 3 m, 2 plantas
  v_ll: 208                    # servicio 120/208 V trifásico (edificio pequeño, pico ≈ 52 kW)
  # Envolvente (EnergyPlus EnvelopeSummary, constructions ASHRAE 189.1-2009 zona climática 1)
  u_muro: 0.860                # EXTWALL MASS (concreto 8 in) W/m2K con películas
  u_techo: 0.274               # EXTROOF IEAD
  u_suelo: 2.945               # EXTSLABCARPET 4IN (losa sobre terreno)
  u_ventana: 6.424             # EXTWINDOW: vidrio simple
  shgc: 0.252
  t_suelo_c: 18.0              # Site:GroundTemperature:BuildingSurface del modelo (valor por defecto de E+;
                               # en Panamá el terreno está a 26–28 °C: ver sensibilidad)
  infiltracion_m3s_m2: 0.00030226  # ZoneInfiltration por m2 de superficie exterior
  u_entrepiso: 1.8            # losa interior entre plantas (W/m2K, estimado)
  ventilacion_m3s_persona: 0.00944 # DesignSpecification:OutdoorAir (9.44 L/s·persona)
  reflectancia_suelo: 0.20
  # VRF (AirConditioner:VariableRefrigerantFlow): COP nominal 3.3; COP estacional real calculado de la
  # simulación (frío total entregado / electricidad VRF): A 2.08, B 1.72, C 3.08
  fraccion_standby_equipos: 0.30
  fraccion_latente_serpentin: 0.10  # latente retirado / sensible (calibrado)
  # Parámetros efectivos del modelo RC calibrados contra EnergyPlus (python -m ems calibrar):
  # CV(RMSE) horario 26 %, NMBE −2 % (ASHRAE Guideline 14: ≤ 30 % y ±10 %)
  capacitancia_kwh_k_m2: 0.030 # masa térmica efectiva por m2 de piso
  factor_solar: 0.5            # fracción de la ganancia solar por ventanas que pasa al aire de inmediato
  delta_t_cielo_c: 6.0         # radiación al cielo: Text equivalente para la conducción de la envolvente

clima:
  fuente: epw                  # epw | sintetico
  epw: data/clima/PAN_PO_Panama-Albrook.Gelabert.Intl.AP.783842_TMYx.2011-2025.epw
  # parámetros del clima sintético (sólo si fuente = sintetico o falta el EPW)
  t_min_c: 24.5
  t_max_c: 31.5
  hora_t_max: 14.5
  irr_max_wm2: 900
  nubosidad_media: 0.35
  semilla: 7

# Horarios del modelo E+ (Schedule:Day:Interval). Cada lista: [hora de inicio, valor] escalonado.
horarios:
  ocupacion:            # "Programacion de horarios" (SCH_Ocupacion_Oficinas / sábados / domingos)
    laborable: [[0, 0], [7, 0.204], [8, 0.602], [9, 1.0], [12, 0.612], [13, 1.0], [17, 0.505], [18, 0]]
    sabado: [[0, 0], [9, 0.202], [13, 0]]
    domingo: [[0, 0]]
  iluminacion:          # SCH_Iluminacion_Oficinas
    laborable: [[0, 0], [7, 0.25], [8, 1.0], [18, 0.245], [19, 0]]
    sabado: [[0, 0], [9, 0.527], [13, 0]]
    domingo: [[0, 0]]
  equipos_oficina:      # SCH_Equipos_Oficinas (el modelo usa el perfil "4" sábado y domingo)
    laborable: [[0, 0.05], [7, 0.25], [8, 0.99], [18, 0.25], [20, 0.05]]
    sabado: [[0, 0.05], [7, 0.25], [8, 0.99], [13, 0.25], [20, 0.05]]
    domingo: [[0, 0.05], [7, 0.25], [8, 0.99], [13, 0.25], [20, 0.05]]
  equipos_conferencia:  # SCH_Sala de conferencias
    laborable: [[0, 0.05], [7, 0.25], [8, 0.995], [11, 0.10], [15, 0.995], [18, 0.25], [20, 0.05]]
    sabado: [[0, 0.05]]
    domingo: [[0, 0.05]]
  continuo:             # SCH_Servidores_24H
    laborable: [[0, 1.0]]
    sabado: [[0, 1.0]]
    domingo: [[0, 1.0]]
  ac_oficinas:          # SCH_AC_Oficinas: setpoint de enfriamiento (°C)
    laborable: [[0, 28], [7, 22], [18, 28]]
    sabado: [[0, 28], [7, 22], [13, 28]]
    domingo: [[0, 28]]
  ac_conferencia:       # SCH_AC_Conferencias
    laborable: [[0, 28], [6, 22], [18, 28]]
    sabado: [[0, 28], [7, 22], [13, 28]]
    domingo: [[0, 28]]
  ac_pasillo:           # SCH_AC_Pasillo
    laborable: [[0, 28], [7, 22], [18, 28]]
    sabado: [[0, 28], [7, 22], [14, 28]]
    domingo: [[0, 28]]
  ac_servidores:        # SCH_AC_Servidores
    laborable: [[0, 24]]
    sabado: [[0, 24]]
    domingo: [[0, 24]]
  ac_electrico:         # SCH_AC_Electrico
    laborable: [[0, 27]]
    sabado: [[0, 27]]
    domingo: [[0, 27]]

ocupacion:
  ruido: 0.10                  # variación aleatoria alrededor del horario del modelo
  ausentismo: 0.08             # fracción media de puestos vacíos en días laborables
  semilla: 11
  hora_entrada: 7.0            # inicio del horario de oficina del modelo
  hora_salida: 18.0

# Precios y factores para Panamá (supuestos; actualice con pliego tarifario ASEP vigente)
tarifa:
  precio_punta_usd_kwh: 0.245      # lunes-viernes 09:00-17:00
  precio_fuera_punta_usd_kwh: 0.185
  hora_punta: [9, 17]
  cargo_demanda_usd_kw_mes: 19.50
  factor_co2_kg_kwh: 0.31

# Inversión del EMS para 800 m² (retrofit ≈ 35–40 USD/m², supuesto: cotizar localmente)
economia:
  capex_usd:
    sensores_ocupacion_temp_lux: 2600   # 10 zonas: PIR, T/HR, lux
    controladores_vrf_bacnet: 4500      # pasarela BACnet/Modbus para los 3 VRF + 10 terminales
    control_iluminacion: 9600           # drivers dimerizables ≈ 12 USD/m2
    enchufes_inteligentes_pdu: 2400
    medicion_electrica: 2500            # medidor de red + submedición por tablero
    gateway_servidor_red: 2500
    software_integracion: 5500
    puesta_en_marcha_capacitacion: 2500
  opex_usd_anio: 1800
  vida_util_anios: 10
  tasa_descuento: 0.08
  escalamiento_tarifa_anual: 0.02

ems:
  banda_histeresis_c: 0.5
  setpoint_ocupado_c: 24.0
  setpoint_desocupado_c: 27.0
  setpoint_baseline_c: 22.0        # setpoint del modelo E+ en horario
  precool_min: 60
  lux_objetivo: 500
  equipos_desocupado_ems: 0.10
  retardo_vacancia_min: 15
  luces_desocupado_ems: 0.0
  limite_demanda_kw: 30            # ≈ 90 % del pico con reglas (≈ 58 % del pico del modelo E+, 51.9 kW)
  dr_histeresis_kw: 3
  dr_margen_confort_c: 0.75
  dr_setpoint_extra_c: 1.5
  dr_luces_nivel: 0.70
  dr_equipos_nivel: 0.85
  confort_max_c: 26.0
  confort_min_c: 21.0
  alarma_servidor_c: 27.0
  mpc_horizonte_pasos: 6
  mpc_niveles: [0.0, 0.25, 0.5, 0.75, 1.0]
  mpc_peso_confort: 25.0
  mpc_peso_pico: 0.02

cargas_fijas: []                   # el modelo E+ no incluye ascensores, bombas ni alumbrado exterior

# Sistemas VRF (unidades exteriores) y zonas que atienden — capacidades autodimensionadas por E+
sistemas_vrf:
  - {id: VRF-A, capacidad_kw: 66.57, cop: 2.08, zonas: [Z04, Z05, Z06, Z07, Z08]}
  - {id: VRF-B, capacidad_kw: 38.69, cop: 1.72, zonas: [Z01, Z02, Z03, Z10]}
  - {id: VRF-C, capacidad_kw: 2.89, cop: 3.08, zonas: [Z09]}

# Zonas. rect = huella en planta (m) con origen en la esquina suroeste del edificio de 20 × 20 m
