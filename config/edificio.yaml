  - {id: Z09, nombre: Cuarto de servidores, tipo: servidores, critica: true, planta: 0, rect: [4, 0, 6, 3],
     area: 18, ocupantes: 0, lpd: 4.44, epd: 0.0, it_kw: 2.0, hvac_kw: 2.89, sistema: VRF-C, fan_w: 86, ventilador: continuo,
