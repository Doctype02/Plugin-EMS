# Edificio de oficinas de 5 plantas en Ciudad de Panamá — 26 zonas acondicionadas, 2000 m²
# Parámetros tomados del modelo OpenStudio/EnergyPlus "Edificio_Sin_EMS" (y "Edificio_Sin_EMS_ConPV" para
# la fotovoltaica): in.idf, eplusout.sql y floorplan.json. Extraídos con tools/importar_energyplus.py
# (data/energyplus/modelo_parametros.json); el origen de cada valor está en los comentarios.
# Planta baja (PB) y plantas 1–4 de 20 × 20 m; núcleo de elevador de 2 × 2 m en cada planta (no acondicionado).

edificio:
  nombre: edificio1
  zona_horaria: America/Panama
  latitud: 8.97                # EPW Panamá-Albrook
  longitud: -79.5
  paso_min: 5
  plantas: 5                   # PB, P1, P2, P3, P4
  nombres_plantas: [PB, P1, P2, P3, P4]
  altura_piso_m: 3.0           # floorplan.json: floor_to_ceiling 3 m (losa de techo FV a 15.3 m)
  v_ll: 480                    # servicio 277/480 V trifásico (pico del modelo ≈ 133 kW)
  # Envolvente (EnergyPlus EnvelopeSummary, U con películas)
  u_muro: 2.478                # CONST_MURO_EXTERIOR_ALTO
  u_techo: 0.605               # CONST_TECHO
  u_suelo: 4.020               # CONST_PISO_PLANTA_BAJA (losa sobre terreno)
  u_ventana: 5.708             # CONST_VIDRIO_TINTADO
  shgc: 0.501
  vt: 0.451                    # transmitancia visible del vidrio
  t_suelo_c: 27.0              # terreno en Panamá ≈ temperatura media anual del aire (26–28 °C)
  t_suelo_energyplus_c: 18.0   # el modelo E+ no define Site:GroundTemperature y usa 18 °C: sólo para validar contra E+
  infiltracion_m3s_m2: 0.0     # el modelo no tiene objetos de infiltración
  u_entrepiso: 1.8             # losa interior entre plantas (W/m2K, estimado)
  ventilacion_m3s_persona: 0.00944 # DesignSpecification:OutdoorAir "ClosedOffice/Conference" (9.44 L/s·persona)
  reflectancia_suelo: 0.20
  # VRF (AirConditioner:VariableRefrigerantFlow): COP nominal 3.3 (PB 3.0); PTAC COP nominal 3.0.
  # El COP estacional de cada sistema (sistemas_vrf.cop) se calibra contra el uso final "Cooling" de E+.
  fraccion_standby_equipos: 0.10
  fraccion_latente_serpentin: 0.10  # latente retirado / sensible
  # Parámetros efectivos del modelo térmico 2R2C (nodo de aire + nodo de masa por zona) calibrados contra la
  # electricidad de E+ (python -m ems calibrar, semanas de febrero y agosto): CV(RMSE) horario 14–17 %, NMBE
  # ≈ +3.5 % (ASHRAE Guideline 14: ≤ 30 % y ±10 %); pico +6.6 %. La masa (80 Wh/K·m², edificio de hormigón)
  # da el retraso con que el interior sigue al clima exterior cuando el aire está apagado.
  factor_cop: 1.30             # multiplicador del COP estacional de VRF y PTAC (calibrado: python -m ems calibrar)
  capacitancia_kwh_k_m2: 0.08  # nodo de masa (losas, muros, tabiques) por m2 de piso
  capacitancia_aire_kwh_k_m2: 0.015  # nodo de aire (aire, mobiliario y capa superficial de tabiques) por m2
  h_aire_masa_kw_k_m2: 0.045   # acople aire ↔ masa: 9.1 W/m2K × ≈5 m2 de superficie (losas, muros, mobiliario) por m2
  fraccion_radiante: 0.5       # parte de las ganancias internas y solares que calienta primero la masa
  arranque:                    # pico de arranque de los compresores (segundos): corriente respecto a la nominal
    factor_vrf: 1.5            # VRF inverter con arranque suave
    factor_ptac: 5.0           # PTAC de pared, arranque directo
  rampa_compresor_por_min: 0.10  # el inverter del VRF sube 10 % de capacidad por minuto (0 → 100 % en 10 min)
  factor_solar: 0.5
  delta_t_cielo_c: 3.0         # radiación al cielo: Text equivalente para la conducción de la envolvente

clima:
  fuente: epw                  # epw | sintetico
  epw: data/clima/PAN_PO_Panama-Albrook.Gelabert.Intl.AP.783842_TMYx.2011-2025.epw
  t_min_c: 24.5
  t_max_c: 31.5
  hora_t_max: 14.5
  irr_max_wm2: 900
  nubosidad_media: 0.35
  semilla: 7

# Horarios del modelo E+ (Schedule:Day:Interval). Cada lista: [hora de inicio, valor] escalonado.
# transicion_min: cada escalón se suaviza en una rampa de esa duración (llegada y salida gradual de la gente,
# encendido progresivo de equipos e iluminación); 0 = escalones de E+.
horarios:
  transicion_min: 60
  ocupacion:            # BASE_Ocupacion
    laborable: [[0, 0], [8, 1.0], [18, 0]]
    sabado: [[0, 0]]
    domingo: [[0, 0]]
  ocupacion_bano:       # BASE_Ocupacion Bano (baños y pasillos)
    laborable: [[0, 0], [7, 0.281], [18, 0]]
    sabado: [[0, 0]]
    domingo: [[0, 0]]
  iluminacion:          # BASE_Iluminacion
    laborable: [[0, 0.1], [7, 1.0], [19, 0.1]]
    sabado: [[0, 0.1], [7, 0.2], [18, 0.1]]
    domingo: [[0, 0.1], [7, 0.2], [18, 0.1]]
  equipos_oficina:      # BASE_Equipos
    laborable: [[0, 0.1], [7, 1.0], [19, 0.1]]
    sabado: [[0, 0.1]]
    domingo: [[0, 0.1]]
  continuo:             # BASE_Servidores
    laborable: [[0, 1.0]]
    sabado: [[0, 1.0]]
    domingo: [[0, 1.0]]
  elevador:             # BASE_Elevador
    laborable: [[0, 0], [7, 0.1], [8, 0.2], [18, 0.1], [19, 0]]
    sabado: [[0, 0.05]]
    domingo: [[0, 0.05]]
  extractores:          # BASE_HVAC (extractores de los baños)
    laborable: [[0, 0], [8, 1.0], [18, 0]]
    sabado: [[0, 0]]
    domingo: [[0, 0]]
  ac_oficinas:          # TEMP_Refrigeracion: setpoint de enfriamiento constante (°C), las 24 h
    laborable: [[0, 22]]
    sabado: [[0, 22]]
    domingo: [[0, 22]]
  ac_banos:             # TEMP_HVAC BANO
    laborable: [[0, 24]]
    sabado: [[0, 24]]
    domingo: [[0, 24]]
  ac_servidores:        # el cuarto de servidores usa TEMP_Refrigeracion
    laborable: [[0, 22]]
    sabado: [[0, 22]]
    domingo: [[0, 22]]

ocupacion:
  ruido: 0.10
  dispersion_llegada_min: 15   # cada zona llega/sale ±15 min respecto al horario según el día
  ausentismo: 0.08
  semilla: 11
  hora_entrada: 8.0            # BASE_Ocupacion
  hora_salida: 18.0

# Precios y factores para Panamá (supuestos; actualice con pliego tarifario ASEP vigente)
tarifa:
  # Tarifa única: 0.15672 USD/kWh a todas las horas (los dos precios iguales; hora_punta ya no cambia el precio)
  precio_punta_usd_kwh: 0.15672
  precio_fuera_punta_usd_kwh: 0.15672
  hora_punta: [9, 17]
  cargo_demanda_usd_kw_mes: 19.50
  factor_co2_kg_kwh: 0.31
  precio_excedente_usd_kwh: 0.10   # energía FV inyectada a la red (medición neta, supuesto)

# Inversión del EMS para 2000 m² y 26 zonas (retrofit ≈ 32 USD/m², supuesto: cotizar localmente)
economia:
  capex_usd:
    sensores_ocupacion_temp_lux: 6800   # 26 zonas: PIR, T/HR, lux
    controladores_vrf_bacnet: 9000      # pasarela BACnet/Modbus para 6 VRF + 21 terminales + 5 PTAC
    control_iluminacion: 24000          # drivers dimerizables ≈ 12 USD/m2
    enchufes_inteligentes_pdu: 5000
    medicion_electrica: 4000            # medidor de red + submedición por planta y FV
    gateway_servidor_red: 3000
    software_integracion: 8000
    puesta_en_marcha_capacitacion: 4000
  opex_usd_anio: 3000
  vida_util_anios: 10
  tasa_descuento: 0.08
  escalamiento_tarifa_anual: 0.02

ems:
  banda_histeresis_c: 0.5
  setpoint_ocupado_c: 24.0
  setpoint_desocupado_c: 27.0
  setpoint_baseline_c: 22.0        # setpoint del modelo E+ (constante)
  precool_min: 90                  # pre-enfriamiento escalonado antes de la entrada (mínimo)
  # arranque óptimo: cada zona empieza antes cuanto más caliente está (lunes tras el fin de semana apagado)
  precool_margen_c: 1.5            # por encima de consigna + 1.5 °C…
  precool_min_por_grado: 70        # …70 min más por cada °C…
  precool_max_min: 420             # …hasta 7 h antes de la entrada (la masa del edificio tarda en enfriarse)
  limite_precool_kw: 90            # tope de potencia antes de abrir ≈ pico de un día normal (reparte el pre-enfriamiento)
  rampa_setpoint_c_h: 3.0          # la consigna cambia como máximo 3 °C por hora (0.25 °C por paso)
  arranques_max_paso: 2            # terminales que pueden arrancar en un mismo paso de 5 min
  t_proteccion_max_c: 32.0         # fuera de horario el aire está apagado salvo que la zona pase de 32 °C…
  t_proteccion_retorno_c: 30.0     # …y entonces enfría sólo hasta 30 °C
  lux_objetivo: 500
  equipos_desocupado_ems: 0.10
  retardo_vacancia_min: 15
  luces_desocupado_ems: 0.0
  limite_demanda_kw: 170           # potencia máxima del edificio (kW)
  dr_histeresis_kw: 5
  dr_margen_confort_c: 0.75
  dr_setpoint_extra_c: 1.5
  dr_luces_nivel: 0.70
  dr_equipos_nivel: 0.85
  confort_max_c: 26.0
  confort_min_c: 21.0
  alarma_servidor_c: 27.0
  mpc_horizonte_pasos: 6
  mpc_niveles: [0.0, 0.25, 0.5, 0.75, 1.0]
  mpc_peso_confort: 25.0
  mpc_peso_pico: 0.02

# Cargas sin zona acondicionada: kw × horario (schedule del modelo E+)
cargas_fijas:
  - {nombre: Ascensor, kw: 14.86, horario: elevador, fp: 0.85, respaldo: true}            # Electric Equipment 3 (14.61 kW) + 4 × 50 W
  - {nombre: Extractores de baños, kw: 0.075, horario: extractores, fp: 0.85}  # Fan:ZoneExhaust, 5 × 15 W

# Planta de respaldo para cortes de red (diseño y cálculos en docs/PLANTA_RESPALDO.md).
# Tablero de emergencia: los 6 sistemas VRF, el ascensor, la iluminación de las zonas y el cuarto de servidores.
# Fuera del respaldo: tomacorrientes de oficina, PTAC de los baños y extractores.
respaldo:
  generador:
    habilitado: true
    potencia_kw: 110             # potencia continua (prime): 137.5 kVA a fp 0.8 (clase 150 kVA en emergencia)
    carga_max: 0.80              # el EMS mantiene la planta por debajo del 80 % de su potencia
    carga_min: 0.30              # los paneles se recortan para que la planta no baje del 30 % (wet stacking)
    arranque_s: 15               # arranque + transferencia automática (lo cubre el UPS de los servidores)
    consumo_vacio_l_h_kw: 0.03   # diésel: L/h por kW nominal en vacío…
    consumo_l_kwh: 0.24          # …más L por kWh entregado (≈ 30 L/h al 100 %, 16.5 L/h al 50 %)
    tanque_l: 600
  ups:
    potencia_kw: 2.7             # 3 kVA en línea de doble conversión para los servidores (1.8 kW de TI)
    autonomia_min: 20            # con la carga de TI; cubre el arranque de la planta y un apagado ordenado
  fv_reconexion_min: 5           # el inversor vuelve 5 min después de que la planta estabiliza la red (IEEE 1547)
  emergencia:                    # reglas del EMS mientras el edificio está en la planta
    setpoint_c: 25.0             # consigna con ocupación
    setpoint_min_c: 24.0         # nadie puede pedir menos de 24 °C (protege la planta)
    luces_nivel: 0.70            # iluminación al 70 %
    tipos_sin_hvac: [pasillo]    # terminales que se apagan

# Fotovoltaica de la variante "ConPV": 6 campos sobre la azotea (Generator:Photovoltaic,
# PhotovoltaicPerformance:Simple, eficiencia fija) e inversor simple. habilitado: valor por defecto;
# en vivo se elige con EMS_FV=si|no. Los escenarios offline se calculan con y sin FV.
fv:
  habilitado: true
  fraccion_activa: 0.6
  eficiencia: 0.24
  inversor: 0.96
  campos:                      # área bruta (m²) sobre la losa de cada zona de la planta 4
    - {id: FV-1, area_m2: 135.0, sobre: Z24}
    - {id: FV-2, area_m2: 90.0, sobre: Z22}
    - {id: FV-3, area_m2: 90.0, sobre: Z23}
    - {id: FV-4, area_m2: 45.0, sobre: Z26}
    - {id: FV-5, area_m2: 36.0, sobre: Z25}
    - {id: FV-6, area_m2: 4.0, sobre: elevador}

# Sistemas de climatización (unidades exteriores) y zonas que atienden — capacidad autodimensionada por E+.
# cop = COP estacional (calibrado). Los PTAC de los baños son equipos de ventana/pared por zona.
sistemas_vrf:
  - {id: VRF-PB, capacidad_kw: 54.18, cop: 1.9, zonas: [Z01, Z02, Z03, Z04]}
  - {id: VRF-P1, capacidad_kw: 58.18, cop: 2.1, zonas: [Z07, Z08, Z09, Z10]}
  - {id: VRF-P2, capacidad_kw: 60.31, cop: 2.1, zonas: [Z12, Z13, Z14, Z15]}
  - {id: VRF-P3, capacidad_kw: 60.95, cop: 2.1, zonas: [Z17, Z18, Z19, Z20]}
  - {id: VRF-P4, capacidad_kw: 62.47, cop: 2.1, zonas: [Z22, Z23, Z24, Z25]}
  - {id: VRF-SRV, capacidad_kw: 3.87, cop: 2.1, zonas: [Z06]}
  - {id: PTAC-PB, capacidad_kw: 1.53, cop: 1.9, zonas: [Z05], tipo: ptac}
  - {id: PTAC-P1, capacidad_kw: 2.09, cop: 1.9, zonas: [Z11], tipo: ptac}
  - {id: PTAC-P2, capacidad_kw: 2.27, cop: 1.9, zonas: [Z16], tipo: ptac}
  - {id: PTAC-P3, capacidad_kw: 2.34, cop: 1.9, zonas: [Z21], tipo: ptac}
  - {id: PTAC-P4, capacidad_kw: 2.68, cop: 1.9, zonas: [Z26], tipo: ptac}

